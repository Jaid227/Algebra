function stats(){let c=counts();return `<div class="stats"><div class="stat"><strong>${c.read}<span> / 24</span></strong><span>Lecciones marcadas como leídas</span></div><div class="stat"><strong>${c.practice}<span> / 24</span></strong><span>Lecciones practicadas</span></div><div class="stat"><strong>${c.complete}<span> / 24</span></strong><span>Prácticas con todos los aciertos</span></div><div class="stat"><strong>${Object.keys(state.days).length}</strong><span>Días con ejercicios respondidos</span></div></div>`}
function go(p){if('speechSynthesis'in window)speechSynthesis.cancel();page=p;render();window.scrollTo({top:0,behavior:'instant'})}function openLesson(i){current=i;state.last=i;quiz=null;persist();go('lesson')}
function card(i){let l=LESSONS[i],x=info(i);return `<article class="lesson-card"><div class="card-top"><span>${String(i+1).padStart(2,'0')} · ${GROUPS[Math.floor(i/6)]}</span><span class="badge">${passed(i)?'✓ 1/1':x.attempts?'En práctica':x.read?'Leída':'Por explorar'}</span></div><h3>${l.title}</h3><p>${l.goal}</p><button data-open="${i}" aria-label="Abrir lección ${i+1}: ${esc(l.title)}">${x.read?'Volver a la lección':'Comenzar lección'} ↗</button></article>`}
function listCards(){let a=LESSONS.map((l,i)=>({l,i})).filter(({l,i})=>(subject==='all'||(subject==='math'?i<12:i>=12))&&(filter<0||Math.floor(i/6)===filter)&&(l.title+' '+l.goal+' '+l.rule).toLowerCase().includes(search.toLowerCase()));$('#lessonCards').innerHTML=a.length?a.map(x=>card(x.i)).join(''):'<p class="empty">No hay coincidencias. Prueba otra palabra o módulo.</p>';$('#resultCount').textContent=a.length+' lecciones'}
function route(){return `<section class="hero"><div><span class="eyebrow">UN CAMINO CLARO, DESDE LA PRIMERA PALABRA</span><h1>Las matemáticas empiezan<br>por las raíces.</h1><p>Elige Matemáticas o Álgebra y comprende cada procedimiento. Avanza paso a paso, con explicaciones en español y pequeños ejercicios que te muestran el porqué.</p><div class="spaced"><button class="primary" id="continue">${Object.keys(state.cards).length?'Continuar mi camino':'Empezar desde cero'} ↗</button><button class="ghost" data-page="guide">Cómo estudiar</button></div><p class="small muted">24 lecciones · ejemplos resueltos · ejercicios explicados · sin límite de intentos</p></div><div class="art" aria-hidden="true"><div class="eyebrow">DE LAS PIEZAS A LA IDEA</div><div class="big">🌱</div><em>x + 3 = 7</em><div class="blocks"><span>Restar 3</span><span>en ambos lados</span><span>x = 4</span></div><p class="small muted">Una base firme. Una idea nueva cada día.</p></div></section>${stats()}<div class="section-head"><div><span class="eyebrow">TU RUTA DE APRENDIZAJE</span><h2>Primero comprende. Después practica.</h2></div><span class="small muted" id="resultCount"></span></div><p class="muted">Sigue el orden recomendado o entra al tema que necesites. Todas las lecciones están disponibles.</p><div class="spaced"><button class="primary" data-subject="math">Matemáticas</button><button class="primary" data-subject="algebra">Álgebra</button><button data-subject="all">Ambas rutas</button></div><div class="filters"><button data-filter="-1" class="${filter<0?'active':''}">Toda la ruta</button>${GROUPS.map((g,i)=>`<button data-filter="${i}" class="${filter===i?'active':''}">${i+1}. ${g}</button>`).join('')}<input id="search" type="search" aria-label="Buscar lecciones" placeholder="Buscar: pronombres, pasado, preguntas…" value="${esc(search)}"></div><div class="cards" id="lessonCards"></div>`}
function sidebar(){return `<aside class="sidebar" aria-label="Índice de lecciones"><span class="eyebrow">PASO A PASO</span>${LESSONS.map((l,i)=>(i%6===0?`<div class="group">${GROUPS[i/6]}</div>`:'')+`<button data-open="${i}" class="${i===current?'current':''}" ${i===current?'aria-current="step"':''}>${passed(i)?'✓':String(i+1).padStart(2,'0')} · ${l.title}</button>`).join('')}</aside>`}
function lesson(){let l=LESSONS[current],x=info(current);return `<div class="study-layout">${sidebar()}<article class="reading"><select id="lessonSelect" class="mobile-index" aria-label="Ir a otra lección">${LESSONS.map((l,i)=>`<option value="${i}" ${i===current?'selected':''}>${i+1}. ${l.title}</option>`).join('')}</select><button class="ghost" data-page="route">← Volver a la ruta</button><p class="eyebrow">${GROUPS[Math.floor(current/6)]} · LECCIÓN ${current+1} DE 24</p><h1>${l.title}</h1><p class="lead">${l.goal}</p><div class="rule"><strong>La idea clave</strong><br>${l.rule}</div><section class="panel text"><h2>Vamos paso a paso</h2>${l.explanation.split('\n').map((p,i)=>`<p><strong>${i+1}.</strong> ${p}</p>`).join('')}<p class="eyebrow">QUÉDATE CON ESTE PATRÓN</p><div class="formula">${l.form}</div></section><section class="panel" style="margin-top:18px"><h2>Míralo en ejemplos</h2><p class="small muted">Estudia el procedimiento antes de practicar. Puedes escuchar la lectura automática, aunque los símbolos pueden leerse de forma imperfecta.</p>${l.examples.map(([e,t,n],j)=>`<div class="example"><button lang="es" data-example="${j}" aria-label="Escuchar: ${esc(e)}">${e} <span style="font:14px system-ui">♪</span></button><p class="translation">${t}</p><p class="note">↳ ${n}</p></div>`).join('')}</section><div class="tip"><b>Un error que puedes evitar</b>${l.trap}</div><details><summary>Antes de practicar: compruébalo con tus palabras</summary><p>Explica la regla sin leerla. Crea un ejercicio parecido cambiando los números y resuélvelo. Explica cada paso. Vuelve a los ejemplos si te atoras.</p><p class="small muted">Esta actividad es libre: la página no evalúa automáticamente tus procedimientos escritos libremente.</p></details><div class="lesson-actions"><button id="markRead" aria-pressed="${x.read}">${x.read?'✓ Lección marcada como leída':'Marcar como leída'}</button><button class="primary" id="practice">Practicar esta lección · 1 ejercicio →</button></div>${x.attempts?`<p class="small muted">Mejor resultado: ${x.best}/1 · Último: ${x.latest}/1 · Intentos: ${x.attempts}. Puedes repetir cuantas veces quieras.</p>`:''}<div id="quizArea" aria-live="polite"></div><div class="lesson-actions">${current>0?`<button data-open="${current-1}">← Anterior</button>`:'<span></span>'}${current<23?`<button data-open="${current+1}">Siguiente lección →</button>`:'<button data-page="progress">Ver mi progreso →</button>'}</div></article></div>`}
function startQuiz(mode='lesson',items=null){quiz={mode,items:items||LESSONS[current].questions.map((_,q)=>({l:current,q})),pos:0,answers:[],selected:null,finished:false};if(page!=='lesson'){go('review')}else{renderQuiz();$('#quizArea').scrollIntoView({behavior:'smooth',block:'start'})}}
function renderQuiz(){let el=$('#quizArea');if(!el||!quiz)return;if(quiz.finished){let n=quiz.answers.filter(x=>x.correct).length;el.innerHTML=`<section class="panel result"><span class="eyebrow">PRÁCTICA COMPLETADA</span><p><strong>${n} / ${quiz.items.length}</strong></p><h2>${n===quiz.items.length?'¡Cada pieza tiene sentido!':'Revisa el porqué y vuelve a intentarlo.'}</h2><p>${n===quiz.items.length?'Resolviste correctamente esta práctica. Resuelve otro ejemplo con números distintos mañana.':'Los errores te muestran qué repasar. La explicación de cada respuesta está aquí abajo.'}</p><div class="spaced" style="justify-content:center"><button class="primary" id="repeatQuiz">Repetir práctica</button><button data-page="progress">Ver progreso</button></div></section>${quiz.answers.map(a=>{let q=LESSONS[a.l].questions[a.q];return `<section class="panel" style="margin:12px 0"><span class="badge">${a.correct?'✓ Correcta':'↻ Para repasar'} · ${LESSONS[a.l].title}</span><p><b>${q.prompt}</b></p><p>Tu respuesta: ${esc(q.options[a.selected])}<br>Respuesta correcta: <b>${esc(q.options[q.answer])}</b></p><p class="muted">${q.why}</p></section>`}).join('')}`;return}let item=quiz.items[quiz.pos],q=LESSONS[item.l].questions[item.q],answered=quiz.selected!==null;el.innerHTML=`<section class="exercise"><span class="eyebrow">${quiz.mode==='lesson'?'PONLO EN PRÁCTICA':LESSONS[item.l].title} · ${quiz.pos+1} DE ${quiz.items.length}</span><div class="bar" style="margin-top:15px"><i style="width:${quiz.pos/quiz.items.length*100}%"></i></div><h3 class="question">${q.prompt}</h3><div class="options">${q.options.map((o,i)=>`<button class="option ${answered?(i===q.answer?'correct':i===quiz.selected?'wrong':''):''}" data-answer="${i}" ${answered?'disabled':''}><b>${String.fromCharCode(65+i)}</b> ${esc(o)} ${answered&&i===q.answer?'✓':''}</button>`).join('')}</div>${answered?`<div class="feedback ${quiz.selected===q.answer?'':'wrong'}"><b>${quiz.selected===q.answer?'✓ ¡Correcto!':'Todavía no. Observa la regla.'}</b><p>${q.why}</p><p class="small">Respuesta correcta: ${esc(q.options[q.answer])}</p><button class="primary" id="nextQuestion">${quiz.pos+1===quiz.items.length?'Ver resultado':'Siguiente ejercicio →'}</button></div>`:'<p class="small muted">Elige una respuesta. Recibirás una explicación antes de continuar.</p>'}</section>`}
function answer(n){if(!quiz||quiz.selected!==null||quiz.finished)return;let item=quiz.items[quiz.pos],q=LESSONS[item.l].questions[item.q];if(n<0||n>=q.options.length)return;quiz.selected=n;let correct=n===q.answer;quiz.answers.push({...item,selected:n,correct});const d=new Date().toLocaleDateString('en-CA');state.days[d]=(state.days[d]||0)+1;let x=info(item.l);if(!correct)x.wrong=[...new Set([...x.wrong,item.q])];else x.wrong=x.wrong.filter(a=>a!==item.q);state.cards[item.l]=x;persist();sound(correct?'good':'bad');renderQuiz()}
function nextQuestion(){if(!quiz||quiz.selected===null||quiz.finished)return;quiz.pos++;quiz.selected=null;if(quiz.pos===quiz.items.length){quiz.finished=true;if(quiz.mode==='lesson'){let x=info(current),score=quiz.answers.filter(a=>a.correct).length;x.attempts++;x.latest=score;x.best=Math.max(x.best,score);state.cards[current]=x;persist()}}renderQuiz();$('#quizArea').scrollIntoView({behavior:'smooth',block:'start'})}
function progress(){let c=counts();return `<span class="eyebrow">TUS BASES, CADA VEZ MÁS FIRMES</span><h1>Tu camino se construye<br>con cada intento.</h1>${stats()}<div class="panel"><h2>Practica lo que necesita atención</h2><p>El repaso de errores reúne las preguntas que aún no has corregido. La práctica mixta elige hasta 12 preguntas de lecciones que ya has leído o practicado.</p><div class="spaced"><button class="primary" id="reviewWrong">Repasar mis errores</button><button id="mixedQuiz">Práctica mixta</button></div><p class="small muted">Los repasos actualizan los errores pendientes, pero no cambian tu mejor resultado de una lección completa.</p></div><div class="twocol">${GROUPS.map((g,j)=>{let n=Array.from({length:6},(_,k)=>j*6+k).filter(passed).length;return `<section class="panel"><span class="eyebrow">MÓDULO ${j+1}</span><h2>${g}</h2><div class="bar"><i style="width:${n/6*100}%"></i></div><p class="small muted">${n}/6 prácticas completas con acierto</p></section>`}).join('')}</div><section class="panel" style="margin-top:18px"><h2>Detalle de tus lecciones</h2>${LESSONS.map((l,i)=>{let x=info(i);return `<div class="progress-row"><div><p>${String(i+1).padStart(2,'0')} · ${l.title}</p><small>${x.read?'Leída':'Sin marcar como leída'} · ${x.attempts?'Mejor: '+x.best+'/1 · Último: '+x.latest+'/1 · '+x.attempts+' intento(s)':'Sin práctica completa'} · ${x.wrong.length} error(es) pendientes</small></div><button data-open="${i}">Repasar →</button></div>`}).join('')}</section><section class="panel" style="margin-top:18px"><h2>Conserva tu avance</h2><p>Tu progreso pertenece a este navegador y a esta dirección. Si cambias de dispositivo o dirección, exporta e importa un respaldo.</p><div class="spaced"><button id="export">Exportar respaldo ↓</button><label>Importar respaldo<br><input type="file" id="import" accept=".json,application/json"></label><button class="ghost" id="reset">Borrar progreso</button></div><p class="small muted">El avance registra lectura y resultados de estos ejercicios; no certifica dominio matemático.</p></section>`}
function guide(){return `<h1>Aprende con lápiz y papel.</h1><div class="panel"><h2>Un método para comprender</h2><p>1. Lee la regla y distingue los datos de lo que buscas.</p><p>2. Copia el ejemplo y explica cada paso con tus palabras.</p><p>3. Intenta resolver el ejercicio antes de mirar las opciones.</p><p>4. Lee la explicación y comprueba el resultado.</p><p>5. Cambia los números y crea un ejercicio propio.</p><h2>Álgebra: piensa en una balanza</h2><p>En una ecuación, ambos lados valen lo mismo. Si restas 4 a un lado, resta 4 al otro. Si divides entre 3, divide ambos lados entre 3. Nunca dividas entre cero.</p><p>Ejemplo: 2x + 4 = 10. Resta 4: 2x = 6. Divide entre 2: x = 3. Comprueba: 2 × 3 + 4 = 10.</p><h2>Cómo se registra el progreso</h2><p>Leída es una marca personal. Practicada significa que terminaste el ejercicio. Un acierto es una comprobación breve, no dominio completo del tema. Repite con otros números en tu cuaderno.</p><p>Exporta tu respaldo antes de cambiar de navegador. La página funciona como un único index.html y puede alojarse en GitHub Pages.</p></div>`}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page||(page==='lesson'&&b.dataset.page==='route')));$('#view').innerHTML=page==='route'?route():page==='lesson'?lesson():page==='progress'?progress():page==='review'?'<button data-page="progress">← Volver a Progreso</button><h1>Un repaso para afianzar.</h1><p class="muted">Recuerda la regla antes de elegir. Cada respuesta incluye su explicación.</p><div class="reading" id="quizArea" aria-live="polite"></div>':guide();if(page==='route')listCards();if(quiz&&(page==='lesson'||page==='review'))renderQuiz()}
function confirmWith(title,text,fn){$('#dialogTitle').textContent=title;$('#dialogText').textContent=text;confirmAction=fn;$('#confirmDialog').showModal()}
function shuffled(a){let b=a.slice();for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function validateBackup(d){if(!d||d.app!=='math-roots'||d.version!==1||!d.progress||typeof d.progress.cards!=='object'||Array.isArray(d.progress.cards)||!d.progress.days||typeof d.progress.days!=='object'||Array.isArray(d.progress.days))throw Error();let cards={},days={};for(let[k,v]of Object.entries(d.progress.cards)){if(!/^\d+$/.test(k)||+k>23||!v||typeof v.read!=='boolean'||!Number.isInteger(v.attempts)||v.attempts<0||!Number.isInteger(v.best)||v.best<0||v.best>3||!Number.isInteger(v.latest)||v.latest<0||v.latest>3||!Array.isArray(v.wrong)||v.wrong.some(n=>!Number.isInteger(n)||n<0||n>2))throw Error();cards[k]={read:v.read,attempts:v.attempts,best:v.best,latest:v.latest,wrong:[...new Set(v.wrong)]}}for(let[k,v]of Object.entries(d.progress.days)){if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!Number.isInteger(v)||v<0)throw Error();days[k]=v}return{cards,days,last:Number.isInteger(d.progress.last)&&d.progress.last>=0&&d.progress.last<24?d.progress.last:0}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='theme'){state.theme=state.theme==='dark'?'light':'dark';preferences();persist();sound();return}if(b.id==='sound'){state.sound=!state.sound;preferences();persist();sound();return}if(b.dataset.answer!==undefined){answer(+b.dataset.answer);return}if(b.dataset.example!==undefined){speak(LESSONS[current].examples[+b.dataset.example][0]);return}sound();if(b.dataset.subject){subject=b.dataset.subject;filter=-1;search='';render();return}if(b.dataset.page){go(b.dataset.page);return}if(b.dataset.open!==undefined){openLesson(+b.dataset.open);return}if(b.dataset.filter!==undefined){filter=+b.dataset.filter;render();return}switch(b.id){case'continue':openLesson(state.last);break;case'markRead':{let x=info(current);x.read=!x.read;state.cards[current]=x;persist();b.textContent=x.read?'✓ Lección marcada como leída':'Marcar como leída';b.setAttribute('aria-pressed',String(x.read));break}case'practice':startQuiz();break;case'nextQuestion':nextQuestion();break;case'repeatQuiz':{let mode=quiz.mode,items=quiz.items.slice();startQuiz(mode,items);break}case'reviewWrong':{let items=[];LESSONS.forEach((l,i)=>info(i).wrong.forEach(q=>items.push({l:i,q})));if(!items.length){toast('No hay errores pendientes. Haz una práctica de lección para empezar.');break}startQuiz('errors',shuffled(items));break}case'mixedQuiz':{let items=[];LESSONS.forEach((l,i)=>{let x=info(i);if(x.read||x.attempts)l.questions.forEach((_,q)=>items.push({l:i,q}))});if(!items.length){toast('Primero lee o completa la práctica de una lección.');break}startQuiz('mixed',shuffled(items).slice(0,12));break}case'testVoice':speak('Resuelve paso a paso.');break;case'export':{let blob=new Blob([JSON.stringify({app:'math-roots',version:1,progress:{cards:state.cards,days:state.days,last:state.last}},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='math-roots-progreso.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);break}case'reset':confirmWith('¿Borrar tu progreso?','Se eliminarán tus marcas de lectura, resultados y actividad. Exporta un respaldo antes si quieres conservarlos. Tus ajustes de tema y audio se mantendrán.',()=>{state.cards={};state.days={};state.last=0;current=0;quiz=null;persist();render();toast('Progreso borrado')});break;case'cancelDialog':$('#confirmDialog').close();confirmAction=null;break;case'acceptDialog':{let fn=confirmAction;confirmAction=null;$('#confirmDialog').close();if(fn)fn();break}}});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;listCards()}});document.addEventListener('change',async e=>{let t=e.target;if(t.id==='lessonSelect')openLesson(+t.value);if(t.id==='accent'){state.accent=t.value;persist()}if(t.id==='rate'){state.rate=Number(t.value);persist()}if(t.id==='import'&&t.files[0]){try{if(t.files[0].size>2000000)throw Error();let p=validateBackup(JSON.parse(await t.files[0].text()));confirmWith('¿Importar este respaldo?','El progreso de este respaldo reemplazará el avance actual. Los ajustes de tema y audio se mantendrán.',()=>{Object.assign(state,p);current=p.last;quiz=null;persist();render();toast('Progreso importado')})}catch{toast('El archivo no es un respaldo válido de Math Roots.')}t.value=''}});$('#confirmDialog').addEventListener('cancel',()=>confirmAction=null);preferences();render();
</script></body></html>
